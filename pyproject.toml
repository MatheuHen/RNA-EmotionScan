[project]
name = "expressao-neural"
version = "1.3"
description = "Reconhecimento de expressões faciais em tempo real utilizando redes neurais"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Matheus Henrique de Araújo Carneiro", email = "matheus.carneiro@academico.unirv.edu.br" },
]
dependencies = [
    "opencv-python==4.12.0.88",
    "numpy==2.2.6",
    "pillow==11.3.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "lento: testes de longa duração (execução prolongada, desempenho)",
]
