<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="330" viewBox="0 0 1180 330" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55606e"/>
    </marker>
  </defs>
  <rect width="1180" height="330" fill="#ffffff"/>
  <text x="24" y="30" font-size="17" font-weight="700" fill="#101418">Classificador de expressões — MobileFaceNet (método Progressive Teacher)</text>
  <text x="24" y="50" font-size="12.5" fill="#55606e">Modelo pré-treinado (OpenCV Zoo, Apache 2.0). Não houve treinamento neste trabalho.</text>
  <line x1="24" y1="64" x2="1156" y2="64" stroke="#c3cad4"/>
  <rect x="24" y="96" width="164" height="104" rx="6" fill="#eaf0f7" stroke="#1f4e79" stroke-width="2"/>
  <text x="106.0" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#1f4e79">Entrada</text>
  <text x="106.0" y="138" text-anchor="middle" font-size="12.5" fill="#55606e">tensor 1×3×112×112</text>
  <text x="106.0" y="155" text-anchor="middle" font-size="12.5" fill="#55606e">RGB, nó 'data'</text>
  <text x="106.0" y="172" text-anchor="middle" font-size="12.5" fill="#55606e">(px/255 − 0,5) / 0,5</text>
  <rect x="212" y="96" width="188" height="104" rx="6" fill="#e8f3ec" stroke="#1e6b3a" stroke-width="2"/>
  <text x="306.0" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#1e6b3a">Convolução inicial</text>
  <text x="306.0" y="138" text-anchor="middle" font-size="12.5" fill="#55606e">extração de bordas</text>
  <text x="306.0" y="155" text-anchor="middle" font-size="12.5" fill="#55606e">e texturas do rosto</text>
  <text x="306.0" y="172" text-anchor="middle" font-size="12.5" fill="#55606e">já alinhado</text>
  <rect x="436" y="96" width="236" height="104" rx="6" fill="#e8f3ec" stroke="#1e6b3a" stroke-width="2"/>
  <text x="554.0" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#1e6b3a">Backbone MobileFaceNet</text>
  <text x="554.0" y="138" text-anchor="middle" font-size="12.5" fill="#55606e">pilha de convoluções</text>
  <text x="554.0" y="155" text-anchor="middle" font-size="12.5" fill="#55606e">separáveis em profundidade</text>
  <text x="554.0" y="172" text-anchor="middle" font-size="12.5" fill="#55606e">(depthwise separable)</text>
  <rect x="708" y="96" width="196" height="104" rx="6" fill="#f0eaf8" stroke="#5b3a8e" stroke-width="2"/>
  <text x="806.0" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#5b3a8e">Vetor de características</text>
  <text x="806.0" y="138" text-anchor="middle" font-size="12.5" fill="#55606e">embedding facial</text>
  <text x="806.0" y="155" text-anchor="middle" font-size="12.5" fill="#55606e">aprendido pela rede</text>
  <rect x="940" y="96" width="216" height="104" rx="6" fill="#fbf0e2" stroke="#9c5a10" stroke-width="2"/>
  <text x="1048.0" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#9c5a10">Camada final</text>
  <text x="1048.0" y="138" text-anchor="middle" font-size="12.5" fill="#55606e">7 logits brutos,</text>
  <text x="1048.0" y="155" text-anchor="middle" font-size="12.5" fill="#55606e">nó de saída 'label'</text>
  <line x1="192" y1="148.0" x2="206" y2="148.0" stroke="#55606e" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="404" y1="148.0" x2="430" y2="148.0" stroke="#55606e" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="676" y1="148.0" x2="702" y2="148.0" stroke="#55606e" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="908" y1="148.0" x2="934" y2="148.0" stroke="#55606e" stroke-width="2" marker-end="url(#seta)"/>
  <text x="24" y="234" font-size="13.5" font-weight="600" fill="#101418">Softmax → distribuição de probabilidades sobre as 7 classes</text>
  <rect x="24" y="250" width="150" height="54" rx="5" fill="#eaf0f7" stroke="#1f4e79" stroke-width="2"/>
  <text x="99.0" y="272" text-anchor="middle" font-size="15" font-weight="600" fill="#1f4e79">Raiva</text>
  <text x="99.0" y="292" text-anchor="middle" font-size="12.5" fill="#55606e">0 angry</text>
  <rect x="185" y="250" width="150" height="54" rx="5" fill="#eaf0f7" stroke="#1f4e79" stroke-width="2"/>
  <text x="260.0" y="272" text-anchor="middle" font-size="15" font-weight="600" fill="#1f4e79">Nojo</text>
  <text x="260.0" y="292" text-anchor="middle" font-size="12.5" fill="#55606e">1 disgust</text>
  <rect x="346" y="250" width="150" height="54" rx="5" fill="#eaf0f7" stroke="#1f4e79" stroke-width="2"/>
  <text x="421.0" y="272" text-anchor="middle" font-size="15" font-weight="600" fill="#1f4e79">Medo</text>
  <text x="421.0" y="292" text-anchor="middle" font-size="12.5" fill="#55606e">2 fearful</text>
  <rect x="507" y="250" width="150" height="54" rx="5" fill="#eaf0f7" stroke="#1f4e79" stroke-width="2"/>
  <text x="582.0" y="272" text-anchor="middle" font-size="15" font-weight="600" fill="#1f4e79">Alegria</text>
  <text x="582.0" y="292" text-anchor="middle" font-size="12.5" fill="#55606e">3 happy</text>
  <rect x="668" y="250" width="150" height="54" rx="5" fill="#eaf0f7" stroke="#1f4e79" stroke-width="2"/>
  <text x="743.0" y="272" text-anchor="middle" font-size="15" font-weight="600" fill="#1f4e79">Neutra</text>
  <text x="743.0" y="292" text-anchor="middle" font-size="12.5" fill="#55606e">4 neutral</text>
  <rect x="829" y="250" width="150" height="54" rx="5" fill="#eaf0f7" stroke="#1f4e79" stroke-width="2"/>
  <text x="904.0" y="272" text-anchor="middle" font-size="15" font-weight="600" fill="#1f4e79">Tristeza</text>
  <text x="904.0" y="292" text-anchor="middle" font-size="12.5" fill="#55606e">5 sad</text>
  <rect x="990" y="250" width="150" height="54" rx="5" fill="#eaf0f7" stroke="#1f4e79" stroke-width="2"/>
  <text x="1065.0" y="272" text-anchor="middle" font-size="15" font-weight="600" fill="#1f4e79">Surpresa</text>
  <text x="1065.0" y="292" text-anchor="middle" font-size="12.5" fill="#55606e">6 surprised</text>
  <text x="24" y="320" font-size="11.5" fill="#55606e">A ordem dos índices é definida por FacialExpressionRecog.getDesc (OpenCV Zoo) e não pode ser alterada.</text>
</svg>