  <text x="762.0" y="137" text-anchor="middle" font-size="12.5" fill="#55606e">Progressive Teacher</text>
  <text x="762.0" y="154" text-anchor="middle" font-size="12.5" fill="#55606e">(ONNX) → 7 logits</text>
